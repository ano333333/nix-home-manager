snippets:
  - name: git add
    keyword: gita
    snippet: git add

  - name: git status --branch
    keyword: gitst
    snippet: git status --branch

  - name: git commit -m
    keyword: gitc
    snippet: git commit -m '{{commit_message}}'

  - name: git commit --amend --no-edit
    keyword: gitca
    snippet: git commit --amend --no-edit

  - name: git commit --fixup
    keyword: gitcf
    snippet: git commit --fixup {{hash}}

  - name: git switch
    keyword: gitsw
    snippet: git switch

  - name: branch
    keyword: br
    snippet: git symbolic-ref --short HEAD
    context:
      lbuffer: '^git\s+'
    evaluate: true

  - name: git rebase -i
    keyword: gitri
    snippet: git rebase -i

  - name: --autosquash
    keyword: -a
    snippet: echo "--autosquash"
    context:
      lbuffer: '^git rebase -i\s+'
    evaluate: true

  - name: lazygit
    keyword: lg
    snippet: lazygit

  - name: nvim
    keyword: n
    snippet: nvim

  - name: yazi
    keyword: Y
    snippet: yazi

  - name: claude
    keyword: cc
    snippet: claude

  - name: codex
    keyword: cx
    snippet: codex -c features.codex_hooks=true
